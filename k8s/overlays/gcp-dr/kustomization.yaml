# 선택적 복구: db-migration Job + core-service + maintenance 만 배포. event-service 없음. (ADR-0004)
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/db-migration   # Flyway Job — Cloud SQL 승격 전에는 NOLOGIN 으로 실패·재시도, 승격 후 성공 (dr-runbook)
  - ../../base/core-service
  - ../../base/maintenance
  - gateway.yaml          # Gateway + HTTPRoute (ADR-0014)
configMapGenerator:
  - name: db-migration-config
    literals: [SPRING_PROFILES_ACTIVE=gcp-dr]
  - name: core-service-config   # REWARD_STREAM_ENABLED=false = 원장 반영 consumer·Redis health 비활성 (DR 에는 Redis 없음, ADR-0004·0019)
    literals: [SPRING_PROFILES_ACTIVE=gcp-dr, REWARD_STREAM_ENABLED=false, DR_MODE=true]
images:   # Artifact Registry (CI 이중 푸시, ADR-0010)
  - name: db-migration   # newTag 는 backend CI 봇이 추가한다 (직접 수정 금지)
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/point-apps/db-migration
  - name: core-service
    newName: asia-northeast3-docker.pkg.dev/PROJECT_ID/point-apps/core-service
    newTag: "0.1.0"
