# GKE(DR) 용 — Terraform(argocd-bootstrap)이 이 경로를 root 로 등록
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: apps-gcp-dr
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/ZZGG2/point-infra.git
    targetRevision: main
    path: k8s/overlays/gcp-dr
  destination:
    server: https://kubernetes.default.svc
    namespace: point
  syncPolicy:
    automated: { prune: true, selfHeal: true }
    syncOptions: [CreateNamespace=true]
    # db-migration Job(Sync hook)이 실패하면 sync 를 다시 시도한다 — DR 은 Cloud SQL 승격 후 자동으로 이어진다 (ADR-0024)
    retry:
      limit: 10
      backoff: { duration: 30s, factor: 2, maxDuration: 5m }
