# 포인트 조회 서비스 (ADR-0024) — 잔액·내역·원장 집계·/api/health. 쓰기 없음, Redis 없음
# DB: point_query 계정(point 스키마 SELECT 만) + read-only 커넥션. db-migration Job(wave 0) 성공 후 배포
apiVersion: apps/v1
kind: Deployment
metadata:
  name: point-query
  labels: { app: point-query }
  annotations:
    argocd.argoproj.io/sync-wave: "1"   # db-migration Job(wave 0) 성공 후 (ADR-0024)
spec:
  # replicas 는 HPA 가 관리한다 (hpa.yaml) — 여기 적으면 ArgoCD sync 때마다 되돌린다
  strategy:
    rollingUpdate: { maxUnavailable: 0, maxSurge: 1 }
  selector:
    matchLabels: { app: point-query }
  template:
    metadata:
      labels: { app: point-query }
    spec:
      serviceAccountName: point-query
      securityContext: { runAsNonRoot: true, runAsUser: 10001 }
      containers:
        - name: point-query
          image: point-query:latest   # overlay 에서 레지스트리/태그 치환
          ports: [{ containerPort: 8083 }]
          envFrom:
            - configMapRef: { name: point-query-config }
            - secretRef: { name: point-query-db }   # DB_URL·DB_USERNAME(point_query)·DB_PASSWORD·JWT_PUBLIC_KEY (External Secrets)
          resources:
            requests: { cpu: 250m, memory: 512Mi }
            limits: { memory: 512Mi }
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            initialDelaySeconds: 60
          lifecycle:
            preStop: { exec: { command: ["sleep", "10"] } }
---
apiVersion: v1
kind: Service
metadata:
  name: point-query
spec:
  selector: { app: point-query }
  ports: [{ port: 80, targetPort: 8083 }]
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: point-query
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: point-query
spec:
  minAvailable: 1
  selector:
    matchLabels: { app: point-query }
