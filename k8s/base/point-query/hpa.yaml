# 조회만 따로 확장한다 (ADR-0024 목표 2). CPU 기준 — 조회는 DB 조회 + JSON 직렬화라 CPU 와 요청량이 비례한다
# 상한은 환경별로 다를 수 있다 (ADR-0023 이 dev/prod overlay 를 나누면 patch 로 조정)
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: point-query
spec:
  scaleTargetRef: { apiVersion: apps/v1, kind: Deployment, name: point-query }
  minReplicas: 2          # PDB minAvailable 1 + 롤링 업데이트 중에도 1개 이상
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: { type: Utilization, averageUtilization: 70 }
